name: Update mise version

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-mise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get current version
        id: current
        run: |
          version=$(grep -oP 'const MiseVersion = "\K[^"]+' internal/toolinfo/toolinfo.go)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get latest mise release
        id: latest
        run: |
          version=$(curl -fsSL https://api.github.com/repos/jdx/mise/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update version
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          sed -i 's/const MiseVersion = ".*"/const MiseVersion = "${{ steps.latest.outputs.version }}"/' internal/toolinfo/toolinfo.go

      - name: Create Pull Request
        if: steps.current.outputs.version != steps.latest.outputs.version
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(deps): bump mise from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}'
          title: 'chore(deps): bump mise from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}'
          body: |
            Automated mise version bump.

            - **Current**: ${{ steps.current.outputs.version }}
            - **Latest**: ${{ steps.latest.outputs.version }}
            - **Release notes**: https://github.com/jdx/mise/releases/tag/v${{ steps.latest.outputs.version }}
          branch: chore/update-mise
          delete-branch: true
          labels: dependencies
