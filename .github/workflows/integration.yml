name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'internal/image/**'
      - 'internal/containerenv/**'
  pull_request:
    paths:
      - 'internal/image/**'
      - 'internal/containerenv/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run E2E integration tests
        run: go test -v -tags integration -timeout 30m ./internal/image/ -run TestIntegration_E2E
