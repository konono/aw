name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.25', '1.26']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Compile integration tests
        if: runner.os != 'Windows'
        run: go test -tags integration -run '^$' ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          # 2.12.0 and later embed the config JSONSchema in the binary. The
          # action runs `config verify` with the version pinned here, so on
          # 2.10.1 every lint run downloaded the schema from golangci-lint.run
          # and a timeout there failed the job with nothing to say about our
          # code. Keep this at 2.12.0 or later; verification stays on.
          version: v2.15.0
