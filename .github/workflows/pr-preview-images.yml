name: PR Preview Images

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'internal/image/**'
      - 'internal/containerenv/**'
      - 'internal/stage/**'
      - 'internal/toolinfo/**'
      - 'internal/pipeline/**'
      - 'docker-bake.hcl'
      - '.github/workflows/pr-preview-images.yml'

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tool: [base, claude, codex, opencode, cursor]
        os: [debian12]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render build context
        run: go run ./cmd/render-image --tool ${{ matrix.tool }} --os ${{ matrix.os }}

      - name: Build and push preview image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REGISTRY: ghcr.io/konono
          TOOL: ${{ matrix.tool }}
          OS: ${{ matrix.os }}
        run: |
          TAG="pr-${PR_NUMBER}"
          ENV_FILE="build/${TOOL}-${OS}/build-args.env"
          INSTALL_SCRIPT=$(grep '^AW_TOOL_INSTALL_SCRIPT=' "$ENV_FILE" | cut -d= -f2-)
          GH_VERSION=$(grep '^AW_GH_VERSION=' "$ENV_FILE" | cut -d= -f2-)
          MISE_VERSION=$(grep '^AW_MISE_VERSION=' "$ENV_FILE" | cut -d= -f2-)
          if [ -z "$INSTALL_SCRIPT" ] && [ "$TOOL" != "base" ]; then
            echo "::error::Missing AW_TOOL_INSTALL_SCRIPT for ${TOOL}-${OS}"
            exit 1
          fi
          docker buildx bake -f docker-bake.hcl "aw-${TOOL}-${OS}" --push \
            --set "aw-${TOOL}-${OS}.args.AW_TOOL_INSTALL_SCRIPT=${INSTALL_SCRIPT}" \
            --set "aw-${TOOL}-${OS}.args.AW_GH_VERSION=${GH_VERSION}" \
            --set "aw-${TOOL}-${OS}.args.AW_MISE_VERSION=${MISE_VERSION}" \
            --set "aw-${TOOL}-${OS}.tags=${REGISTRY}/aw-${TOOL}:${TAG}-${OS}"

  comment-preview:
    needs: build-preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `pr-${{ github.event.pull_request.number }}`;
            const tools = ['base', 'claude', 'codex', 'opencode', 'cursor'];
            const lines = [
              '### 🐳 Preview images published',
              '',
              '```bash',
              '# Pull and test:',
              ...tools.map(t => `docker pull ghcr.io/konono/aw-${t}:${tag}-debian12`),
              '',
              '# Or use with aw (set image in profile):',
              `#   image: ghcr.io/konono/aw-claude:${tag}-debian12`,
              '```',
              '',
              `<sub>Built from ${context.sha.substring(0, 7)}</sub>`,
            ];
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
            });
            const marker = '### 🐳 Preview images published';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.pull_request.number }},
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete preview images
        uses: actions/github-script@v7
        with:
          script: |
            const pr = ${{ github.event.pull_request.number }};
            const exactTag = `pr-${pr}-debian12`;
            const org = context.repo.owner;
            for (const tool of ['base', 'claude', 'codex', 'opencode', 'cursor']) {
              const pkg = `aw-${tool}`;
              try {
                const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  package_type: 'container',
                  package_name: pkg,
                  username: org,
                  per_page: 100,
                });
                for (const v of versions) {
                  if (v.metadata?.container?.tags?.some(t => t === exactTag)) {
                    console.log(`Deleting ${pkg}:${v.metadata.container.tags}`);
                    await github.rest.packages.deletePackageVersionForUser({
                      package_type: 'container',
                      package_name: pkg,
                      username: org,
                      package_version_id: v.id,
                    });
                  }
                }
              } catch (e) {
                console.log(`Cleanup for ${pkg}: ${e.message}`);
              }
            }
