name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render build contexts
        run: go run ./cmd/render-image --all --os debian12

      - name: Set version
        id: version
        run: echo "ver=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      - name: Build and push images
        env:
          VERSION: ${{ steps.version.outputs.ver }}
        run: |
          for tool in claude codex opencode cursor; do
            INSTALL_SCRIPT=$(grep '^AW_TOOL_INSTALL_SCRIPT=' "build/${tool}-debian12/build-args.env" | cut -d= -f2-)
            docker buildx bake -f docker-bake.hcl "${tool}" --push \
              --set "${tool}.args.AW_TOOL_INSTALL_SCRIPT=${INSTALL_SCRIPT}"
          done

      - name: Create arch-specific tags
        env:
          VER: ${{ steps.version.outputs.ver }}
          REGISTRY: ghcr.io/konono
        run: |
          for tool in claude codex opencode cursor; do
            for arch in amd64 arm64; do
              digest=$(docker buildx imagetools inspect \
                "${REGISTRY}/aw-${tool}:${VER}-debian12" \
                --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${arch}\"}}{{.Digest}}{{end}}{{end}}")
              if [ -n "$digest" ]; then
                docker buildx imagetools create \
                  --tag "${REGISTRY}/aw-${tool}:${VER}-debian12-${arch}" \
                  "${REGISTRY}/aw-${tool}:${VER}-debian12@${digest}"
              fi
            done
          done
