name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tool: [claude, codex, opencode, cursor]
        os: [debian12, ubuntu2604, ubi9, ubi10]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render build context
        run: go run ./cmd/render-image --tool ${{ matrix.tool }} --os ${{ matrix.os }}

      - name: Set version
        id: version
        run: echo "ver=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      - name: Build and push image
        env:
          VERSION: ${{ steps.version.outputs.ver }}
          TOOL: ${{ matrix.tool }}
          OS: ${{ matrix.os }}
        run: |
          ENV_FILE="build/${TOOL}-${OS}/build-args.env"
          INSTALL_SCRIPT=$(grep '^AW_TOOL_INSTALL_SCRIPT=' "$ENV_FILE" | cut -d= -f2-)
          GH_VERSION=$(grep '^AW_GH_VERSION=' "$ENV_FILE" | cut -d= -f2-)
          MISE_VERSION=$(grep '^AW_MISE_VERSION=' "$ENV_FILE" | cut -d= -f2-)
          if [ -z "$INSTALL_SCRIPT" ]; then
            echo "::error::Missing AW_TOOL_INSTALL_SCRIPT for ${TOOL}-${OS}"
            exit 1
          fi
          docker buildx bake -f docker-bake.hcl "aw-${TOOL}-${OS}" --push \
            --set "aw-${TOOL}-${OS}.args.AW_TOOL_INSTALL_SCRIPT=${INSTALL_SCRIPT}" \
            --set "aw-${TOOL}-${OS}.args.AW_GH_VERSION=${GH_VERSION}" \
            --set "aw-${TOOL}-${OS}.args.AW_MISE_VERSION=${MISE_VERSION}"

      - name: Create arch-specific tags
        env:
          VER: ${{ steps.version.outputs.ver }}
          REGISTRY: ghcr.io/konono
          TOOL: ${{ matrix.tool }}
          OS: ${{ matrix.os }}
        run: |
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect \
              "${REGISTRY}/aw-${TOOL}:${VER}-${OS}" \
              --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${arch}\"}}{{.Digest}}{{end}}{{end}}")
            if [ -z "$digest" ]; then
              echo "::error::Failed to get ${arch} digest for aw-${TOOL}:${VER}-${OS}"
              exit 1
            fi
            docker buildx imagetools create \
              --tag "${REGISTRY}/aw-${TOOL}:${VER}-${OS}-${arch}" \
              "${REGISTRY}/aw-${TOOL}:${VER}-${OS}@${digest}"
          done
