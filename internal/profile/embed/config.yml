# aw - agent-workspace configuration
#
# Run `aw init` to write this file to:
#   Linux/macOS: ~/.config/aw/config.yml
#   Windows:     %APPDATA%\aw\config.yml
#
# Top-level fields act as defaults for all profiles below.
#
# Config is loaded in order: built-in → global config → .aw.yml
# Paths use forward slashes on all platforms: ~/certs/corp.pem or C:/certs/corp.pem
# Project-level .aw.yml can override these settings. If a project
# config contains security-sensitive fields (mounts, env, dockerfile, image,
# worktree.on-create, worktree.on-end), aw will prompt you to trust it on
# first use.

default: claude

# ── Container settings ────────────────────────────────────────────────
environment: container        # "host" or "container"
os: debian12                  # "debian12", "ubi9", "ubi10", "ubuntu2604"
container_runtime: podman     # "docker" or "podman"
# container_user: agent       # container user name (default: "agent")

# ── GitHub CLI ───────────────────────────────────────────────────────
# gh_token: false             # detect gh token via 'gh auth token' and pass as GITHUB_TOKEN (default: false)
                              # also installs gh CLI in the container
# mount_gh: false             # [DEPRECATED] mount ~/.config/gh read-only; use gh_token instead
# ── Host resource mounts ─────────────────────────────────────────────
mount_ssh: false              # mount ~/.ssh read-only (default: false)
ssh_agent_forwarding: false   # forward SSH agent socket (default: false, preferred over mount_ssh)
# mount_container_sock: false  # mount container runtime socket (default: false)
                               # enables docker-compose / docker CLI inside the container (DooD)

# ── Build-time settings ─────────────────────────────────────────────
# build_env:                   # passed as --build-arg to docker/podman build
#   HTTP_PROXY: "http://proxy.corp:8080"
#   HTTPS_PROXY: "http://proxy.corp:8080"
#   NO_PROXY: "localhost,127.0.0.1"
# ca_cert: "~/certs/corporate-ca.pem"   # CA certificate for corporate proxy
                                         # installed via update-ca-certificates before tool install
# packages:                    # extra OS packages to install in the container
#   - jq
#   - tree

profiles:
  shell:
    launch: shell             # "shell", "claude", "codex", "opencode", "cursor"

  claude:
    launch: claude
    # `aw auth login claude` -> `claude auth login`
    # Vertex / Bedrock / API key で使う場合は auth を省略し、env / mounts で認証

  codex:
    launch: codex
    # `aw auth login codex` -> `codex login --device-auth`

  opencode:
    launch: opencode

  cursor:
    launch: cursor
    # `aw auth login cursor` -> `agent login`
    # API key で使う場合は auth を省略し、env: CURSOR_API_KEY で認証

  ubi9-shell:
    os: ubi9
    launch: shell

  ubi10-shell:
    os: ubi10
    launch: shell

  ubuntu2604-shell:
    os: ubuntu2604
    launch: shell

  # ── Example: full-featured profile ────────────────────────────────
  #
  # custom:
  #   environment: container
  #   launch: claude
  #   os: ubuntu2604
  #   container_runtime: podman
  #   dockerfile: docker/Dockerfile.custom   # use either os, dockerfile, or image
  #   # image: 'aw-container:hash'          # pre-built image (mutually exclusive with os/dockerfile)
  #   # container_user: dev                 # container user name (default: "agent")
  #                                         # custom Dockerfile 使用時はそのユーザー名を指定
  #
  #   # ── Environment variables (passed into the container) ─────────
  #   env:
  #     FOO: bar
  #
  #   # ── Custom bind mounts ────────────────────────────────────────
  #   # Mounts are read-only by default. Set mode: rw to allow writes.
  #   # Use options for Docker/Podman mount flags (SELinux, nocopy, etc.)
  #   mounts:
  #     - source: ~/.config/gcloud
  #       target: /home/agent/.config/gcloud
  #       # mode: ro                  # "ro" (default) or "rw"
  #       # options: "z"              # SELinux, nocopy, cached, etc.
  #
  #   # ── Extra packages ──────────────────────────────────────────────
  #   packages:
  #     - jq
  #     - tree
  #
  #   # ── Build-time arguments (passed to docker/podman build) ──────
  #   # Keys starting with AW_ are reserved and will be rejected.
  #   build_env:
  #     HTTP_PROXY: "http://proxy.corp:8080"
  #     HTTPS_PROXY: "http://proxy.corp:8080"
  #
  #   # ── CA certificate for corporate proxy ────────────────────────
  #   # Installed via update-ca-certificates before tool installation.
  #   # Path format: ~/certs/corp.pem or C:/certs/corp.pem (Windows)
  #   # ca_cert: "~/certs/corporate-ca.pem"
  #
  #   # ── Entrypoint install control ──────────────────────────────────
  #   # skip_devbox_install: true          # skip project devbox install on startup
  #   # skip_mise_install: true            # skip project mise install on startup
  #
  #   # ── Host resource mounts ──────────────────────────────────────
  #   # mount_gh: true               # mount ~/.config/gh read-only (default: false)
  #   # mount_ssh: true              # mount ~/.ssh read-only (default: false)
  #   # ssh_agent_forwarding: true   # forward SSH agent (preferred over mount_ssh)
  #
  #   # ── Auth configuration ────────────────────────────────────────
  #   auth:
  #     on_launch:
  #       # Optional auth check before launch (does NOT log in automatically).
  #       # "none" | "warn" | "require"
  #       check: warn
  #     codex:
  #       login_mode: device          # browser | device | api-key | access-token
  #       credentials_store: file     # file | keyring | auto
  #       seed_from_host: if_missing  # if_missing | always | never
  #       persist_auth: stage
  #       login_args:
  #         - --device-auth
  #     claude:
  #       login_mode: console         # browser | console | email | sso
  #       login_args: []
  #     opencode:
  #       provider: openai
  #       method: api-key
  #       login_args: []
  #
  #   # ── Git worktree automation ───────────────────────────────────
  #   # on-create and on-end run shell commands on the HOST.
  #   # Project configs that set these will trigger a trust prompt.
  #   worktree:
  #     base: origin/main
  #     dir: ~/worktrees/my-project
  #     on-create: ./scripts/setup.sh
  #     on-end: ./scripts/cleanup.sh
  #
  #   # ── Build settings (aw build) ─────────────────────────────────
  #   # build:
  #   #   include:                    # copy host dirs into the image
  #   #     - src: ./certs
  #   #       dst: /usr/local/share/ca-certificates
  #   #   env:                        # bake env vars into the image
  #   #     HTTP_PROXY: http://proxy.corp:8080
  #
  #   # ── Example: Claude on Vertex (external auth) ─────────────────
  #   # Auth is omitted because Claude reads credentials from env + mounts.
  #   #
  #   # env:
  #   #   CLAUDE_CODE_USE_VERTEX: "1"
  #   #   CLOUD_ML_REGION: "us-east5"
  #   #   ANTHROPIC_VERTEX_PROJECT_ID: "my-gcp-project"
  #   # mounts:
  #   #   - source: ~/.config/gcloud
  #   #     target: /home/agent/.config/gcloud
  #   #     options: "z"

# ── チーム（エージェント間連携）────────────────────────────────────
# 複数のエージェントをチームとして起動し、メッセージングで協調させます。
# 詳細は docs/teams.md を参照してください。
#
# delivery: メッセージ通知の受信方法を制御
#   turn    — ターン終了時に Stop hook で未読チェック（claude/codex のデフォルト）
#   monitor — SessionStart でバックグラウンド常時監視
#   off     — MCP pull のみ、自動通知なし（cursor/opencode のデフォルト）
#
# バックグラウンドメンバーはメッセージ駆動ループ (agent-loop) で動作し、
# print mode (claude -p / agent -p) でメッセージを処理します。
# 対応ツール: Claude Code, Cursor Agent
#
# teams:
#   review-team:
#     members:
#       - profile: claude
#         role: developer           # developer, reviewer, lead, partner
#         foreground: true          # 対話ターミナル（チームに 1 つだけ）
#       - profile: claude
#         role: reviewer            # バックグラウンドで agent-loop 実行
#
# delivery モードをプロファイルで上書きする例:
#
# profiles:
#   claude-monitor:
#     launch: claude
#     delivery: monitor             # Stop hook の代わりに SessionStart で常時監視
#
# チームの起動:
#   aw team start --task "FizzBuzz を実装して" review-team
#
# チームの停止:
#   aw team stop review-team
