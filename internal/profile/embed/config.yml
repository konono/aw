# aw - agent-workspace configuration
#
# Run `aw init` to write this file to ~/.config/aw/config.yml.
# Top-level fields act as defaults for all profiles below.
#
# Config is loaded in order: built-in → ~/.config/aw/config.yml → .agent-workspace.yml
# Project-level .agent-workspace.yml can override these settings. If a project
# config contains security-sensitive fields (mounts, env, dockerfile,
# worktree.on-create, worktree.on-end), aw will prompt you to trust it on
# first use.

default: claude

# ── Container settings ────────────────────────────────────────────────
environment: container        # "host" or "container"
os: debian12                  # "debian12", "ubi9", "ubi10", "ubuntu2604"
container_runtime: podman     # "docker" or "podman"

# ── Host resource mounts ─────────────────────────────────────────────
# mount_gh: false             # mount ~/.config/gh read-only (default: false)
                              # ⚠ gh token is readable by the AI agent; enable only with scoped tokens
mount_ssh: false              # mount ~/.ssh read-only (default: false)
ssh_agent_forwarding: false   # forward SSH agent socket (default: false, preferred over mount_ssh)

profiles:
  shell:
    launch: shell             # "shell", "claude", "codex", "opencode", "zellij"

  claude:
    launch: claude
    # `aw auth login claude` -> `claude auth login`
    # Vertex / Bedrock / API key で使う場合は auth を省略し、env / mounts で認証

  codex:
    launch: codex
    # `aw auth login codex` -> `codex login --device-auth`

  opencode:
    launch: opencode
    # `aw auth login opencode` -> `opencode auth login`

  ubi9-shell:
    os: ubi9
    launch: shell

  ubi10-shell:
    os: ubi10
    launch: shell

  ubuntu2604-shell:
    os: ubuntu2604
    launch: shell

  # ── Example: full-featured profile ────────────────────────────────
  #
  # custom:
  #   environment: container
  #   launch: zellij
  #   os: ubuntu2604
  #   container_runtime: podman
  #   dockerfile: docker/Dockerfile.custom   # use either os or dockerfile
  #
  #   # ── Environment variables (passed into the container) ─────────
  #   env:
  #     FOO: bar
  #
  #   # ── Custom bind mounts ────────────────────────────────────────
  #   # Mounts are read-only by default. Set mode: rw to allow writes.
  #   # Use options for Docker/Podman mount flags (SELinux, nocopy, etc.)
  #   mounts:
  #     - source: ~/.config/gcloud
  #       target: /home/agent/.config/gcloud
  #       # mode: ro                  # "ro" (default) or "rw"
  #       # options: "z"              # SELinux, nocopy, cached, etc.
  #
  #   # ── Host resource mounts ──────────────────────────────────────
  #   # mount_gh: true               # mount ~/.config/gh read-only (default: false)
  #   # mount_ssh: true              # mount ~/.ssh read-only (default: false)
  #   # ssh_agent_forwarding: true   # forward SSH agent (preferred over mount_ssh)
  #
  #   # ── Auth configuration ────────────────────────────────────────
  #   auth:
  #     on_launch:
  #       # Optional auth check before launch (does NOT log in automatically).
  #       # "none" | "warn" | "require"
  #       check: warn
  #     codex:
  #       login_mode: device          # browser | device | api-key | access-token
  #       credentials_store: file     # file | keyring | auto
  #       seed_from_host: if_missing  # if_missing | always | never
  #       persist_auth: stage
  #       login_args:
  #         - --device-auth
  #     claude:
  #       login_mode: console         # browser | console | email | sso
  #       login_args: []
  #     opencode:
  #       provider: openai
  #       method: api-key
  #       login_args: []
  #
  #   # ── Git worktree automation ───────────────────────────────────
  #   # on-create and on-end run shell commands on the HOST.
  #   # Project configs that set these will trigger a trust prompt.
  #   worktree:
  #     base: origin/main
  #     dir: ~/worktrees/my-project
  #     on-create: ./scripts/setup.sh
  #     on-end: ./scripts/cleanup.sh
  #
  #   # ── Zellij settings ───────────────────────────────────────────
  #   zellij:
  #     layout: default
  #     tool: claude                  # "claude", "codex", "opencode"
  #
  #   # ── Example: Claude on Vertex (external auth) ─────────────────
  #   # Auth is omitted because Claude reads credentials from env + mounts.
  #   #
  #   # env:
  #   #   CLAUDE_CODE_USE_VERTEX: "1"
  #   #   CLOUD_ML_REGION: "us-east5"
  #   #   ANTHROPIC_VERTEX_PROJECT_ID: "my-gcp-project"
  #   # mounts:
  #   #   - source: ~/.config/gcloud
  #   #     target: /home/agent/.config/gcloud
  #   #     options: "z"
