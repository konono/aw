# Starter config used when no config files exist.
# Run `aw init` to write this file to ~/.config/aw/config.yml and edit it.
#
# Top-level fields here act as defaults for all profiles below.
default: claude
environment: container        # "host" or "container"
os: debian12                  # "debian12", "ubi9", "ubi10", "ubuntu2604"
container_runtime: podman     # "docker" or "podman"
mount_ssh: false              # opt-in: set true to mount host ~/.ssh read-only

profiles:
  shell:
    launch: shell             # "shell", "claude", "codex", "opencode", "zellij"

  claude:
    launch: claude

  codex:
    launch: codex

  opencode:
    launch: opencode

  ubi9-shell:
    os: ubi9
    launch: shell

  ubi10-shell:
    os: ubi10
    launch: shell

  ubuntu2604-shell:
    os: ubuntu2604
    launch: shell

  # Example with additional optional fields you can use in any profile:
  #
  # custom:
  #   environment: container
  #   launch: zellij
  #   os: ubuntu2604
  #   container_runtime: podman
  #   dockerfile: docker/Dockerfile.custom   # use either os or dockerfile
